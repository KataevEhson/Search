{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Подробнее</title>
<link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="fon">
<a class="menulink" href="/films/">Назад</a>
<div class="blok">
<h1>{{ i.name }}</h1>
<p>{{ i.caption }}</p>
<p>{{ i.ganr_id.name }}</p>
{% if i.photo %}<img class="foto" src="{{ i.photo.url }}" alt="{{ i.name }}">{% endif %}
<form method="POST" action="/del_film/{{ i.id }}/">
    {% csrf_token %}
    <button class="naiti" type="submit">Удалить</button>
</form>
</div>
</body>
</html>
